schema_version: 1
name: skill-typescript
description: Opinionated TypeScript rules usable as a shared skill.

# Single source of truth (canonical rules live there)
source_of_truth: principles.md

instructions_markdown: |-
  Follow `principles.md` as the single source of truth.
  If a rule conflicts with explicit project requirements, project requirements win.
  Keep `CLAUDE.md`, `.github/copilot-instructions.md`, and `rulebook.yaml` aligned with `principles.md`.

